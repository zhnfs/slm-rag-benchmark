[project]
name = "slm-rag-benchmark"
version = "0.1.0"
description = "Benchmark: Fine-tuned SLM vs Frontier Model for domain-specific RAG extraction"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "transformers>=4.45.0",
    "torch>=2.4.0",
    "peft>=0.13.0",
    "openai>=2.33.0",
    "pandas>=3.0.2",
    "tabulate>=0.10.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

